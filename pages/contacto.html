    <main>
        <section>
            <h1>Contactate con nosotros</h1>
            <form action="" method="">
                <label for="nombreyapellido">Nombre y Apellido</label>
                <input type="text" id="nombreyapellido" required>
                <label for="tuemail">Ingresa tu Email</label>
                <input type="email" name="" id="tuemail" required>
                <label for="tunumerodetel">Ingresa tu Numero de Telefono</label>
                <input type="tel" id="tunumerodetel" required>
                <label for="mensaje">Dejanos tu mensaje</label>
                <textarea name="" id="mensaje" required minlength="20"></textarea>
                <button type="submit">Enviar</button>
                <input type="reset">
            </form>
        </section>
        <div>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3639.4167906470857!2d-65.2980394!3d-24.192178199999997!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x941b0f455a41f2b7%3A0x6a3ac60d7c38fd73!2sLeandro%20N.%20Alem%20623%2C%20Y4607AGI%20San%20Salvador%20de%20Jujuy%2C%20Jujuy!5e0!3m2!1ses!2sar!4v1791755167022!5m2!1ses!2sar" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
